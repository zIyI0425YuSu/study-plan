<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff2e5"><title>To Do List</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header class="top"><div class="brand">To Do List</div><div class="account"><span id="cloud-state">正在检查连接…</span><button id="auth-toggle" type="button">登录</button><button id="logout" type="button" hidden>退出</button></div></header><section class="auth-panel" id="auth-panel" hidden><h2>共享空间登录</h2><div class="auth-fields"><input id="email" type="email" autocomplete="username" placeholder="邮箱"><input id="password" type="password" autocomplete="current-password" placeholder="密码"><button id="login" type="button">登录</button></div><p id="auth-notice"></p></section><section class="intro"><p class="kicker">YOUR EVERYDAY PLANNER</p><h1>把今天安排好。</h1><p>选择日期，查看待办，与重要的人共享进度和留言。</p></section><section class="planner"><div class="calendar-column"><div class="calendar-head"><button id="prev-month" type="button" aria-label="上个月">‹</button><h2 id="month-title"></h2><button id="next-month" type="button" aria-label="下个月">›</button></div><div class="date-picker"><label>年 <select id="year-select"></select></label><label>月 <select id="month-select"></select></label><label>日 <select id="day-select"></select></label><button id="go-date" type="button">前往日期</button></div><div id="calendar" class="calendar"></div><div class="month-footer"><span id="month-count"></span><span>蓝色标记为今天</span></div></div><div class="day-column"><div class="day-heading"><div><p class="kicker" id="day-weekday"></p><h2 id="selected-date"></h2></div><span id="day-count" class="count"></span></div><form id="task-form" class="task-form" hidden><input id="task-title" maxlength="160" placeholder="添加这一天的待办" aria-label="待办内容" required><button type="submit">添加</button></form><div id="task-list" class="task-list"></div><p id="task-status" class="status"></p><section class="message-board"><h3>当天留言</h3><div id="messages" class="messages"></div><form id="message-form" class="message-form"><textarea id="message-input" maxlength="1200" placeholder="写一句话…" aria-label="留言内容"></textarea><button id="send" type="submit" disabled>发送</button></form><p id="board-status" class="status">登录后查看共享留言</p></section></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="app.js"></script></body></html>
